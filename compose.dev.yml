# Development-only Postgres. These credentials are for local use and tests only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mathquest
      POSTGRES_PASSWORD: mathquest
      POSTGRES_DB: mathquest
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathquest"]
      interval: 2s
      timeout: 3s
      retries: 20
