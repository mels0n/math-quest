skill: pick
items:
  - id: bigger
    prompt:
      - {kind: text, value: "Which number is bigger?"}
    answer: {kind: choice, value: 2}
    choices:
      - [{kind: math, value: "3"}]
      - [{kind: math, value: "5"}]
      - [{kind: math, value: "9"}]
      - [{kind: math, value: "7"}]
  - id: half
    prompt:
      - {kind: text, value: "Which picture shows one half?"}
    answer: {kind: choice, value: 0}
    choices:
      - [{kind: math, value: '\frac{1}{2}'}]
      - [{kind: math, value: '\frac{1}{3}'}]
      - [{kind: text, value: "two halves"}]
