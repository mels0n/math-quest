[project]
name = "mathquest"
version = "0.1.0"
description = "Adaptive math game for kids: backend API and problem engine."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "sympy==1.14.0",
    "argon2-cffi>=23.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.120",
    "httpx>=0.28",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "import-linter>=2.1",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.importlinter]
root_package = "mathquest"

[[tool.importlinter.contracts]]
name = "Backend layers import downward only"
type = "layers"
layers = [
    "mathquest.app",
    "mathquest.api",
    "mathquest.features",
    "mathquest.entities",
    "mathquest.shared",
]

[[tool.importlinter.contracts]]
name = "Engine is independent of the application layers"
type = "forbidden"
source_modules = ["mathquest.engine"]
forbidden_modules = [
    "mathquest.api",
    "mathquest.features",
    "mathquest.entities",
    "mathquest.shared",
]
