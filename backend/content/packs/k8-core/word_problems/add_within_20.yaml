# Word problems for Add to 20. Every template uses the generator's {a} and {b} and
# asks for their sum. Short sentences (12 words or fewer) and simple words.
skill: add_within_20
templates:
  - id: gives_more
    text_template: "{name} has {a} {obj}. {friend} gives {name} {b} more. How many {obj} now?"
    slots: {name: names, friend: names, obj: objects}
    grade_band: 1
  - id: birds_on_fence
    text_template: "{a} birds sit on a fence. {b} more birds land. How many birds are there?"
    grade_band: 1
  - id: beach_shells
    text_template: "{name} finds {a} shells at the beach. Then {name} finds {b} more. How many shells?"
    slots: {name: names}
    grade_band: 1
  - id: bus_riders
    text_template: "There are {a} kids on the bus. {b} more kids get on. How many kids now?"
    grade_band: 1
  - id: reading_pages
    text_template: "{name} reads {a} pages in the morning. Then {name} reads {b} pages at night. How many pages in all?"
    slots: {name: names}
    grade_band: 1
  - id: together
    text_template: "{name} has {a} {obj}. {friend} has {b} {obj}. How many {obj} do they have together?"
    slots: {name: names, friend: names, obj: objects}
    grade_band: 1
  - id: garden_flowers
    text_template: "{name} plants {a} red flowers and {b} yellow flowers. How many flowers in all?"
    slots: {name: names}
    grade_band: 1
  - id: fish_tank
    text_template: "A tank has {a} fish. {name} adds {b} more fish. How many fish now?"
    slots: {name: names}
    grade_band: 1
  - id: block_tower
    text_template: "{name} builds a tower with {a} blocks. Then {name} adds {b} blocks. How many blocks?"
    slots: {name: names}
    grade_band: 1
  - id: picking_apples
    text_template: "{name} picks {a} apples. {friend} picks {b} apples. How many apples did they pick?"
    slots: {name: names, friend: names}
    grade_band: 1
  - id: frog_hops
    text_template: "A frog hops {a} times. Then it hops {b} more times. How many hops?"
    grade_band: 1
  - id: baking_cookies
    text_template: "{name} bakes {a} cookies. Then {name} bakes {b} more. How many cookies are there?"
    slots: {name: names}
    grade_band: 1
  - id: game_points
    text_template: "{name} scores {a} points. Then {name} scores {b} more points. How many points in all?"
    slots: {name: names}
    grade_band: 1
  - id: library_books
    text_template: "{name} takes {a} books from the library. {friend} takes {b} books. How many books?"
    slots: {name: names, friend: names}
    grade_band: 1
  - id: farm_eggs
    text_template: "The hens lay {a} eggs on Monday. They lay {b} eggs on Tuesday. How many eggs?"
    grade_band: 1
