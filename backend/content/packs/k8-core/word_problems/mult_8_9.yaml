# Word problems for Times 8 and 9 (3.OA.C.7). Every template uses the generator's {g} groups of
# {s} and asks for the total. Each story's groups are equal, and there are at least two of
# them and at least two in each, so a plural noun is always right. No sentence starts with a
# number.
skill: mult_8_9
templates:
  - id: spider_tanks
    text_template: "The science room has {g} bug boxes. Each box has {s} beetles. How many beetles are there?"
    grade_band: 3
  - id: crayon_tubs
    text_template: "The art room has {g} tubs of crayons. Each tub has {s} crayons. How many crayons are there?"
    grade_band: 3
  - id: marching_band
    text_template: "The marching band walks in {g} lines. Each line has {s} players. How many players march?"
    grade_band: 3
  - id: chair_rows
    text_template: "{name} sets out {g} rows with {s} chairs in each. How many chairs is that?"
    slots: {name: names}
    grade_band: 3
  - id: bus_station
    text_template: "At the station, {g} buses wait. Each bus holds {s} riders. How many riders can the buses carry?"
    grade_band: 3
  - id: tomato_plants
    text_template: "A farmer plants {g} rows of tomatoes. Each row gets {s} plants. How many plants go in the ground?"
    grade_band: 3
  - id: game_savings
    text_template: "{name} puts {s} coins in a piggy bank every week. After {g} weeks, how many coins are in it?"
    slots: {name: names}
    grade_band: 3
  - id: candle_boxes
    text_template: "A shop sells candles in boxes of {s}. How many candles are in {g} boxes?"
    grade_band: 3
  - id: lunch_cards
    text_template: "Each lunch table gets a set of {s} cards. How many cards do {g} tables get?"
    grade_band: 3
  - id: rock_wall
    text_template: "A rock wall has {g} routes. Each route has {s} holds. How many holds does the wall have?"
    grade_band: 3
  - id: basket_pack
    text_template: "{name} tucks {s obj} into every basket. How many {obj} are in {g} baskets?"
    slots: {name: names, obj: objects}
    grade_band: 3
  - id: lake_docks
    text_template: "The lake has {g} docks. Each dock has {s} boats tied to it. How many boats are on the lake?"
    grade_band: 3
  - id: song_books
    text_template: "The music room stacks {g} piles of song books. Each pile has {s} books. How many books is that?"
    grade_band: 3
  - id: bird_feeders
    text_template: "Birds visit {g} feeders. Each feeder has {s} birds at it. How many birds are visiting?"
    grade_band: 3
  - id: stair_flights
    text_template: "{name} climbs {g} flights of stairs. Each flight has {s} steps. How many steps does {name} climb?"
    slots: {name: names}
    grade_band: 3
  - id: sand_castles
    text_template: "At the beach, {g} kids build sand castles. Each kid uses {s} shells. How many shells do they use?"
    grade_band: 3
