# The build plan: skills that are designed but not built yet. This file is never loaded
# for play or placement; a batch moves its skills into skills.yaml (see
# docs/how-to/add-content.md). The content lint checks it together with the built skills.
#
# scope:
#   regions       the regions this plan covers (ids from world.yaml)
#   grade_bands   the grade bands it covers; each needs an anchor
#
# Each entry under `planned` has the fields of skills.yaml except `generator`,
# `word_share`, `bank_share` and `vocabulary`, plus:
#   standards   Common Core codes the skill covers, such as K.CC.A.1 or 2.NBT.B.5
#   batch       the build batch, 1 upwards; a permanent label, so built batches leave the
#               file and the plan starts at its lowest remaining one. A skill's
#               prerequisites are in the same or an earlier batch (or already built)
#   unlocks     (optional) skills that gain this one as a prerequisite once it is built;
#               how the plan puts a new foundation under a skill that already exists
# Order here breaks ties in the topological order, so keep it by batch.
scope:
  regions: [number_meadows, operation_canyon]
  grade_bands: ["K", "1", "2", "3"]
