# Four ways to explain adding to 10, plus feedback for each mistake the generator knows.
# None of them shows the answer: pictures show the start and the hops, and the learner
# counts.
skill: add_within_10
approaches:
  - style: visual
    body_md: >-
      Find {big} on the number line and put your finger there. Now count on
      {small}, one hop at a time. Where you stop is the answer.
    visual:
      kind: number_line
      params: {min: 0, max: 10, start: "{big}", jumps: "{small}"}
  - style: steps
    body_md: |-
      1. Find the bigger number. Say it out loud.
      2. Hold up one finger for each number you add.
      3. Count on as you lift each finger.
      4. The last number you say is the answer.
  - style: story
    body_md: >-
      Make a pile of red blocks, {a} of them. Then add blue blocks, {b} of
      them. How many blocks are in the pile now? That is \({a} + {b}\).
  - style: worked
    body_md: >-
      Let us do yours together. Say {big} out loud. Now count on {small},
      one number at a time. Keep track on your fingers. The last number you
      say is the answer.
misconceptions:
  subtracted_instead: >-
    It looks like you took away. The plus sign means put {a} and {b}
    together. So the answer is bigger than both.
  counted_start: >-
    Nearly! It looks like you counted {big} as a hop. Start at {big}. The
    next number you say is hop one.
