# Four ways to explain adding to 20, plus feedback for each mistake the generator knows.
# None of them shows the answer: the number line shows the start and the jumps.
skill: add_within_20
approaches:
  - style: visual
    body_md: >-
      Picture a number line. Put your finger on {big}. Count on {small}, one
      jump at a time to the right. The number where you stop is the answer.
    visual:
      kind: number_line
      params: {min: 0, max: 20, start: "{big}", jumps: "{small}"}
  - style: steps
    body_md: |-
      1. Find the bigger number and say it out loud.
      2. Count on the other number, one at a time.
      3. Use your fingers to keep track.
      4. The last number you say is the answer.
  - style: story
    body_md: >-
      {a} ducks swim in a pond. {b} more ducks fly down and join them. How
      many ducks are in the pond now? That is \({a} + {b}\).
  - style: worked
    body_md: >-
      Let us do yours together. Say {big}. Then count on {small} more, and
      lift a finger for each one. When {small} fingers are up, stop. The
      last number you said is the answer.
misconceptions:
  subtracted_instead: >-
    It looks like you took away. The plus sign means put {a} and {b}
    together. So the answer is bigger than both.
  counted_start: >-
    You were close! It looks like you counted {big} as a jump. For
    \({a} + {b}\), start at {big}. The next number you say is jump one.
