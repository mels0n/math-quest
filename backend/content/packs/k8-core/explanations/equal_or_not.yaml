# Four ways to explain making both sides equal, plus feedback for each mistake the generator
# knows. None of them shows the answer, and none gives the number one side makes.
skill: equal_or_not
approaches:
  - style: visual
    body_md: >-
      Picture a seesaw. Both sides must weigh the same. Work out how much the side with two numbers weighs. Then see what the other side needs.
  - style: steps
    body_md: |-
      1. Find the side with two numbers.
      2. Work out what it makes.
      3. Look at the other side.
      4. Find the number that makes both sides match.
  - style: story
    body_md: >-
      Two jars must hold the same number of beads. One jar is full. The other jar has some. You count {beside} so far. How many more does it need?
  - style: worked
    body_md: >-
      Let us do yours together. Work out the side with two numbers. Remember what it makes. Now count up from {beside} to that number. How many counts is that?
misconceptions:
  gave_the_total: >-
    It looks like you gave what one side makes. The blank is only part of the other side.
  copied_a_number: >-
    It looks like you copied a number from the sentence. Work out what each side makes.
  added_all_the_numbers: >-
    It looks like you added every number. Each side makes its own total. Make the two totals match.
