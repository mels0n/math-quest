# Skill pack. Each entry under `skills` has:
#   id                 unique snake_case identifier
#   name               short, kid-facing display name
#   region             map region the skill belongs to (an id from world.yaml)
#   prerequisites      ids that must be mastered first ([] for none)
#   fluency            true for recall-speed skills, false for concept skills
#   anchor             true for skills used as placement anchors; placement takes
#                      them in topological order as a ladder from easiest to hardest
#   generator          problem generator id (existing skills use their own id)
#   tiers              one {id, label} per generator tier, ids 0, 1, 2 ... in order
#   grade_band         K, 1 to 8, A1 or A2
#   keypad             answer keypad: numpad, numpad_neg, fraction, mixed, decimal,
#                      exponent, algebra, or choice (answer buttons, no keypad)
#   word_problems_fit  true when word problems suit the skill (default false)
#   word_share         share of problems shown as word problems (default 0.4)
#   banked             true when the skill also draws from bank items (default false)
#   bank_share         share of problems taken from the bank (default 0.25)
#   vocabulary         extra words the content lint accepts in this skill's K to 2
#                      text beyond content/lint/k2_words.txt (lowercase; default [])
# Order here breaks ties in the topological order.
skills:
  - id: count_to_10
    name: Count to 10
    region: number_meadows
    prerequisites: []
    fluency: false
    anchor: true
    generator: count_to_10
    tiers:
