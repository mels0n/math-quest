# Three hints for Count to 10: a nudge, the next step, then the whole answer worked out.
skill: count_to_10
levels:
  - text_template: >-
      Find {near} in the question. The answer is {rel} {near}.
  - text_template: >-
      Count {dir} from {near}, one number at a time. Say each number out loud.
  - text_template: >-
      Start at {near} and count {dir}. The answer is {rel} {near}. You say {answer}.
