# Three hints, gentlest first: a nudge, the next step, then the whole answer worked out.
skill: sub_within_10
levels:
  - text_template: >-
      You start with {a} and take {b} away. The answer is less than {a}.
  - text_template: >-
      Start at {a}. Count back {b}, one at a time. Do not say {a} again.
  - text_template: >-
      Start at {a} and count back {b}. You land on {{= a - b }}. So
      \({a} - {b} = {{= a - b }}\).
