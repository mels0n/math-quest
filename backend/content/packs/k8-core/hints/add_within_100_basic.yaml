# Three hints for Add Ones and Tens: a nudge, the next step, then the whole answer worked out.
skill: add_within_100_basic
levels:
  - text_template: >-
      Think of tens and ones. Add ones to ones and tens to tens.
  - text_template: >-
      Add the ones first: {a_ones} and {b_ones}. Then add the tens: {a_tens} and {b_tens}.
  - text_template: >-
      The ones make {{= a_ones + b_ones }}. The tens make {{= a_tens + b_tens }}. Ten ones make a new ten. Put it all together. So \({a} + {b} = {{= a + b }}\).
