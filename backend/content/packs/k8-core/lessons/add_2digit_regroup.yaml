# Lesson shown the first time a learner meets Add and Carry. Its examples are
# numbers the skill never asks, so a replayed lesson never repeats a question.
skill: add_2digit_regroup
screens:
  - title: Ten ones make a ten
    body_md: >-
      Ten cubes can swap for one stick. We call this carrying. Here is 13. It
      is 1 ten and 3 ones. Ten ones become one ten.
    visual:
      kind: base_ten
      params: {tens: 1, ones: 3}
  - title: Add the ones first
    body_md: >-
      To add 38 and 47, start with the ones. 8 and 7 make {{= 8 + 7 }}. That
      is 1 ten and 5 ones. Write the 5 in the ones place. Carry the 1 ten.
  - title: Then add the tens
    body_md: >-
      Now add the tens. 3 tens and 4 tens and the carried ten make
      {{= 3 + 4 + 1 }} tens. So \(38 + 47 = {{= 38 + 47 }}\).
    visual:
      kind: base_ten
      params: {tens: 8, ones: 5}
worked_example:
  prompt:
    - {kind: math, value: "29 + 54 = ?"}
  steps:
    - Add the ones. 9 and 4 make {{= 9 + 4 }}.
    - That is 1 ten and 3 ones. Write 3 and carry the ten.
    - Add the tens. 2 and 5 and the carried 1 make {{= 2 + 5 + 1 }}.
    - So \(29 + 54 = {{= 29 + 54 }}\).
try_it:
  tier: 0
