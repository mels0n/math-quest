# Lesson shown the first time a learner meets Subtract from 10. Its examples start
# above 10, so a replayed lesson never shows a problem the skill asks.
skill: sub_within_10
screens:
  - title: Take some away
    body_md: >-
      Subtracting means taking some away. You have 12 blocks. You give 3
      away. Now you have fewer. \(12 - 3\) means 12, take away 3.
    visual:
      kind: base_ten
      params: {ones: 12}
  - title: Count back
    body_md: >-
      Start at the first number. Then count back, one jump at a time. For
      \(11 - 4\), start at 11 and jump back 4 times. Say 10, 9, 8, 7. You
      land on {{= 11 - 4 }}.
    visual:
      kind: number_line
      params: {min: 0, max: 12, start: 11, jumps: [-1, -1, -1, -1], end: 7}
  - title: Check by adding
    body_md: >-
      Adding can check your answer. \(12 - 3 = {{= 12 - 3 }}\). Now put them
      back: \(9 + 3 = {{= 9 + 3 }}\). You are back at 12, so it is right.
worked_example:
  prompt:
    - {kind: math, value: "12 - 5 = ?"}
  steps:
    - Start at 12, the first number.
    - Count back 5. Say 11, 10, 9, 8, 7.
    - The last number you say is the answer.
    - So \(12 - 5 = {{= 12 - 5 }}\).
try_it:
  tier: 0
