# Lesson shown the first time a learner meets Add Big Numbers. Adding is shown with
# tens and ones, so a child sees why each column is added on its own.
skill: add_2digit_no_regroup
screens:
  - title: Tens and ones
    body_md: >-
      A two-digit number has tens and ones. The number 34 is 3 tens and 4
      ones. Here it is as blocks. A stick is one ten. A cube is one one.
    visual:
      kind: base_ten
      params: {tens: 3, ones: 4}
  - title: Add the tens
    body_md: >-
      To add 34 and 25, add tens with tens. 3 tens and 2 tens make
      {{= 3 + 2 }} tens. Add ones with ones too. 4 ones and 5 ones make
      {{= 4 + 5 }} ones.
    visual:
      kind: base_ten
      params: {tens: 5, ones: 9}
  - title: Put it together
    body_md: >-
      Now put the tens and the ones together. {{= 3 + 2 }} tens and
      {{= 4 + 5 }} ones make {{= 34 + 25 }}. So \(34 + 25 = {{= 34 + 25 }}\).
worked_example:
  prompt:
    - {kind: math, value: "52 + 36 = ?"}
  steps:
    - Split both numbers into tens and ones.
    - Add the tens. 5 tens and 3 tens make {{= 5 + 3 }} tens.
    - Add the ones. 2 ones and 6 ones make {{= 2 + 6 }} ones.
    - So \(52 + 36 = {{= 52 + 36 }}\).
try_it:
  tier: 0
