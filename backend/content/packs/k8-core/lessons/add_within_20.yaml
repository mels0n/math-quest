# Lesson shown the first time a learner meets Add to 20. Its examples go past 20, so a
# replayed lesson never shows a problem the skill asks.
skill: add_within_20
screens:
  - title: Putting groups together
    body_md: >-
      Adding means putting two groups together. When you add, you get more.
      \(18 + 5\) means 18, and then 5 more.
  - title: Count on
    body_md: >-
      Start at the bigger number. Then count on, one jump at a time. For
      \(17 + 4\), start at 17 and jump 4 times. Say 18, 19, 20, 21. You
      land on {{= 17 + 4 }}.
    visual:
      kind: number_line
      params: {min: 10, max: 25, start: 17, jumps: [1, 1, 1, 1]}
  - title: Make the next ten
    body_md: >-
      Tens are friendly numbers. For \(18 + 5\), split 5 into 2 and 3. Now
      18 and 2 make 20. Then 20 and 3 make {{= 20 + 3 }}. So
      \(18 + 5 = {{= 18 + 5 }}\).
    visual:
      kind: number_line
      params: {min: 10, max: 25, start: 18, jumps: [2, 3]}
worked_example:
  prompt:
    - {kind: math, value: "19 + 4 = ?"}
  steps:
    - Start at 19, the bigger number.
    - Take 1 from the 4 to make 20. That leaves 3.
    - 20 and 3 make {{= 20 + 3 }}.
    - So \(19 + 4 = {{= 19 + 4 }}\).
try_it:
  tier: 0
