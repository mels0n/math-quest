# Bank items for Compare to 1000: the signs, and numbers that are the same. About one item
# in four has two equal numbers, so always choosing a side is no strategy. Tier 0 pairs have
# hundreds digits two or more apart, tier 1 pairs share the hundreds digit, and tier 2 pairs
# are the tricky ones: the smaller number has the bigger last two digits, a zero in the tens
# place, or a 1000.
skill: compare_numbers_1000
items:
