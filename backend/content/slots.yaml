# Units in typed pools, so a template asks for the kind it can use ("{unit}" from
# length_units for a walk). Only units taught by grade 2 for now; mass and volume
# pools come with the grade 3 content.
length_units:
  - {one: inch, many: inches}
  - {one: foot, many: feet}
  - {one: centimeter, many: centimeters}
  - {one: meter, many: meters}
time_units:
  - {one: minute, many: minutes}
  - {one: hour, many: hours, article: an}
  - {one: day, many: days}
  - {one: week, many: weeks}
money_units:
  - {one: cent, many: cents}
  - {one: dollar, many: dollars}
